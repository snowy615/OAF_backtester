[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oaf-backtester"
version = "0.1.0"
description = "Oxford Alpha Fund: natural-language-to-backtest platform (idea -> signal -> simulated portfolio -> metrics -> IBKR)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "pydantic>=2.6",
]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
ibkr = ["ib_async>=1.0"]
yahoo = ["yfinance>=0.2.40"]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8"]
all = ["oaf-backtester[llm,ibkr,yahoo,plots,dev]"]

[project.scripts]
oaf = "oaf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning"]
